name: One-time deploy-safe frontend dependency refresh
on:
  push:
    branches:
      - chore/deploy-safe-frontend-upgrades-20261009
    paths:
      - .github/workflows/one-time-frontend-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26.8.2
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Apply compatible Dependabot package bumps on current master
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const p = JSON.parse(fs.readFileSync(path, 'utf8'));
          const deps = {
            '@radix-ui/react-avatar': '^1.2.7',
            '@radix-ui/react-dialog': '^1.2.0',
            '@radix-ui/react-dropdown-menu': '^2.1.25',
            '@radix-ui/react-popover': '^1.2.0',
            '@radix-ui/react-slot': '^1.4.0',
            '@radix-ui/react-tooltip': '^1.3.0',
            '@tanstack/react-query': '^5.104.1',
            'lucide-react': '^1.52.0',
            'radix-ui': '^1.7.0',
            'react-day-picker': '^10.0.2',
          };
          const devDeps = {
            '@types/node': '^26.6.4',
            '@vitejs/plugin-react': '^6.1.2',
            'eslint': '^10.12.0',
            'globals': '^17.13.0',
            'typescript-eslint': '^8.71.1',
            'vite': '^8.3.3',
          };
          if (p.dependencies?.shadcn) throw new Error('SECURITY: shadcn CLI must stay removed');
          if (p.dependencies?.motion !== '^14.0.0') throw new Error('Motion 14 must be preserved');
          for (const [name, target] of Object.entries(deps)) {
            if (typeof p.dependencies[name] !== 'string') throw new Error('Unexpected dependency ' + name);
            p.dependencies[name] = target;
          }
          for (const [name, target] of Object.entries(devDeps)) {
            if (typeof p.devDependencies[name] !== 'string') throw new Error('Unexpected dev dependency ' + name);
            p.devDependencies[name] = target;
          }
          fs.writeFileSync(path, JSON.stringify(p, null, 2) + '\n');
          NODE
      - name: Regenerate lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Security audit
        run: pnpm audit --audit-level moderate
      - name: Typecheck, tests, lint and production build
        run: |
          pnpm lint
          pnpm test
          pnpm build
      - name: Verify frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Commit validated updates
        working-directory: .
        run: |
          git config user.name 'deManage dependency maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package.json frontend/pnpm-lock.yaml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'chore(deps): apply validated frontend updates without restoring shadcn'
          git push origin HEAD:refs/heads/chore/deploy-safe-frontend-upgrades-20261009
