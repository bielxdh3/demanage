name: Go slice

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  go-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: go-slice
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false
      - name: Resolve module files for draft CI bootstrap
        id: tidy
        run: go mod tidy
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test synthetic health contracts
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Upload public Go module files for owner commit
        if: steps.tidy.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: go-module-files-bootstrap
          path: |
            go-slice/go.mod
            go-slice/go.sum
          if-no-files-found: error
