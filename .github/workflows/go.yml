name: Go slice

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  go-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: go-slice
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false
      - name: Check module files are tidy
        run: go mod tidy -diff
      - name: Verify downloaded module integrity
        run: go mod verify
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test synthetic health contracts
        run: go test -mod=readonly ./...
      - name: Vet
        run: go vet -mod=readonly ./...
